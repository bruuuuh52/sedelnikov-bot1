# Инструкция:
# - Не удаляйте и не меняйте названия полей (слева от двоеточия)
# - Отступы важны! Используйте пробелы (НЕ табы)
# - Текст в кавычках можно менять свободно
# - Чтобы добавить вопрос — скопируйте блок под "questions:" и измените
# - После изменений перезапустите бота
# ============================================================

